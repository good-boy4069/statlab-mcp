[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statlab-mcp"
version = "1.1.0"
description = "统计分析 MCP Server：27 个纯计算统计工具，让 AI agent 获得可复现、可追责的真实统计学能力（与 DeepSeek Harness 无关的独立项目）"
readme = "README.md"
requires-python = ">=3.12"   # 锁定依赖 numpy 2.5.2 的最低要求（实测验证于 3.13；CI 覆盖 3.12/3.13）
license = { text = "MIT" }
authors = [{ name = "周翔宇" }]
keywords = ["mcp", "statistics", "data-analysis", "scipy", "statsmodels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]

# 依赖双轨（v1.0.3 起，见 statlab_mcp/docs/SPEC.md 第 7 节）：
# - dependencies 为发布用范围约束（下限 = 当前锁定版本，pip 安装时解析范围内最新版）
# - requirements.txt 为开发/CI 锁定权威（可复现性承诺），两者不冲突
dependencies = [
    "numpy>=2.5.2,<3",
    "pandas>=3.0.5,<4",
    "scipy>=1.18.1,<2",
    "statsmodels>=0.14.6,<1",
    "scikit-learn>=1.9.0,<2",
    "matplotlib>=3.11.1,<4",
    "pmdarima>=2.1.1,<3",
    "openpyxl>=3.1.5,<4",
    "mcp>=2.1.0,<3",
    "mcp-types>=2.1.0,<3",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
statlab-mcp = "statlab_mcp.server:main"

[tool.setuptools.packages.find]
include = ["statlab_mcp*"]

# v1.1.0 P0-1 打包闭环：statlab_mcp/docs/（SPEC/clients/design 文档）随包分发，
# 运行期 statlab_mcp._resources 经 importlib.resources 定位（不依赖 cwd）
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
statlab_mcp = ["docs/*.md", "docs/design/*.md"]   # 红队 P2-3：package-data 相对包根解析

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ISC", "DTZ", "BLE"]
# BLE001：全库统一 except Exception -> 中文脱敏文案是设计模式（红队 I3），豁免
# DTZ005：save_plot 文件名时间戳有意使用本地时间（人类可读），豁免
# RUF001/2/3：中文注释中的全角标点是项目语言规范，豁免
# E402：tests 的 sys.path 引导后导入包是测试环境标准模式，豁免
ignore = ["BLE001", "DTZ005", "RUF001", "RUF002", "RUF003", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lower_bound_compat: T5 下限兼容矩阵容差断言组（对锁定参考常量 rel<=1e-6；主矩阵同跑天然绿，dep_matrix job 以 -m 专选复核）",
]