[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statlab-mcp"
version = "1.0.1"
description = "统计分析 MCP Server：25 个纯计算统计工具，让 AI agent 获得可复现、可追责的真实统计学能力（与 DeepSeek Harness 无关的独立项目）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "周翔宇" }]
keywords = ["mcp", "statistics", "data-analysis", "scipy", "statsmodels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]

# 注意：依赖唯一权威 = requirements.txt（锁定版本），本文件不写 dependencies（项目规范）

[tool.setuptools.packages.find]
include = ["statlab_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ISC", "DTZ", "BLE"]
# BLE001：全库统一 except Exception -> 中文脱敏文案是设计模式（红队 I3），豁免
# DTZ005：save_plot 文件名时间戳有意使用本地时间（人类可读），豁免
# RUF001/2/3：中文注释中的全角标点是项目语言规范，豁免
# E402：tests 的 sys.path 引导后导入包是测试环境标准模式，豁免
ignore = ["BLE001", "DTZ005", "RUF001", "RUF002", "RUF003", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]